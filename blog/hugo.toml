baseURL = "https://blog.beyondborders.com.sa/"
locale = "en-us"
title = "Beyond Borders Blog"
theme = "hugo-theme-stacknote"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[permalinks]
  articles = "/:slug/"

[params]
  author = "Beyond Borders"
  authorInitials = "BB"
  tagline = "Insights on Middle East market entry and IT services"
  description = "Beyond Borders helps businesses establish, grow, and thrive across the Middle East — insights on entity setup, immigration, outsourcing, and IT services."
  homeEyebrow = "INSIGHTS"
  homeTitle = "Notes on doing business in the Middle East"
  homeIntro = "Practical guidance on market entry, compliance, and the IT services that support growing businesses."
  mainSection = "articles"
  authorPage = "/"
  showToc = true
  showTopics = true
  showAbout = false
  showNewsletter = false
  minTagPostsToIndex = 2
  themeColor = "#F7F5EF"
  favicon = "/images/logo.png"

[[menu.main]]
  name = "Main Site"
  url = "https://beyondborders.com.sa/"
  weight = 10

[[menu.main]]
  name = "Archive"
  url = "/archives/"
  weight = 20

[[menu.main]]
  name = "Search"
  url = "/search/"
  weight = 30

[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 40
