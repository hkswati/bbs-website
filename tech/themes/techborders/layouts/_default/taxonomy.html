{{ define "main" }}
<section class="page-hero">
  <div class="container">
    <div class="page-hero-inner">
      <h1>{{ .Title }}</h1>
    </div>
  </div>
</section>
<section class="page-content">
  <div class="container">
    {{ range .Pages }}
    <p><a href="{{ .Permalink }}">{{ .Title }}</a></p>
    {{ end }}
  </div>
</section>
{{ end }}
