{{ define "main" }}
<section class="page-hero">
  <div class="container">
    <div class="page-hero-inner">
      <h1>{{ .Title }}</h1>
      {{ with .Params.tagline }}<p class="page-tagline">{{ . }}</p>{{ end }}
    </div>
  </div>
</section>
<section class="page-content">
  <div class="container">
    <div class="prose">{{ .Content }}</div>
  </div>
</section>
{{ end }}
