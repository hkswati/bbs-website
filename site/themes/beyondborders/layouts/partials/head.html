<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Params.seoTitle | default .Title }} · Beyond Borders{{ end }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" href="/images/logo.png" />
<link rel="stylesheet" href="/css/main.css" />
{{ if .OutputFormats.Get "RSS" }}
<link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="{{ .OutputFormats.Get "RSS" }}" />
{{ end }}
