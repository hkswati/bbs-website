{{ define "main" }}
<section class="page-hero container">
  <div class="page-hero-inner">
    <span class="pill">{{ .Section | humanize }}</span>
    <h1>{{ .Title }}</h1>
    {{ with .Params.tagline }}<p class="page-tagline">{{ . }}</p>{{ end }}
  </div>
</section>

<section class="page-content container">
  <div class="prose">
    {{ .Content }}
  </div>
</section>

<section class="cta-strip">
  <div class="container cta-strip-inner">
    <div class="decor-stair decor-stair--light" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="cta-strip-text">
      <h2>Ready to get started?</h2>
      <p>Speak to our team and find out how we can help you establish your business in the Middle East.</p>
    </div>
    <a href="/contact/" class="btn btn-primary">Contact Us</a>
  </div>
</section>
{{ end }}
