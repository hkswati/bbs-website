# ── Beyond Borders Blog — nginx configuration (HTTPS, Hugo static site) ───
# Replaces Ghost CLI's proxy config now that the blog is a static Hugo site.
#
# Deploy steps:
#   1. sudo cp /etc/nginx/sites-available/blog.beyondborders.com.sa-ssl.conf /etc/nginx/sites-available/blog.beyondborders.com.sa-ssl.conf.ghost-bak
#   2. sudo cp blog.beyondborders.com.sa-ssl.conf /etc/nginx/sites-available/blog.beyondborders.com.sa-ssl.conf
#   3. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name blog.beyondborders.com.sa;

    ssl_certificate     /etc/letsencrypt/blog.beyondborders.com.sa/fullchain.cer;
    ssl_certificate_key /etc/letsencrypt/blog.beyondborders.com.sa/blog.beyondborders.com.sa.key;
    include             /etc/nginx/snippets/ssl-params.conf;

    root /var/www/blog-static;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;

    client_max_body_size 50m;
}
