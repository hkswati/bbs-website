# ── Beyond Borders Blog — nginx configuration (HTTP, port 80) ─────────────
# Replaces Ghost CLI's proxy config now that the blog is a static Hugo site.
#
# Deploy steps:
#   1. sudo cp /etc/nginx/sites-available/blog.beyondborders.com.sa.conf /etc/nginx/sites-available/blog.beyondborders.com.sa.conf.ghost-bak
#   2. sudo cp blog.beyondborders.com.sa.conf /etc/nginx/sites-available/blog.beyondborders.com.sa.conf
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# Note: root points at /var/www/blog-static (not Ghost's directory) so the
# ACME challenge webroot survives the eventual Ghost removal. The saved
# acme.sh Le_Webroot for this domain also needs updating to match — see
# reference_ssl_cert_layout memory / ask before Ghost is decommissioned.

server {
    listen 80;
    listen [::]:80;

    server_name blog.beyondborders.com.sa;
    root /var/www/blog-static;

    location ~ ^/.well-known/acme-challenge {
        allow all;
    }

    location / {
        return 301 https://blog.beyondborders.com.sa$request_uri;
    }

    client_max_body_size 50m;
}
