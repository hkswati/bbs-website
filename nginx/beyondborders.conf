# ── Beyond Borders — nginx configuration (main site only) ─────────────────
# Ghost CLI manages blog.beyondborders.com.sa in its own nginx config.
#
# Deploy steps (run when DNS has been switched):
#   1. sudo cp beyondborders.conf /etc/nginx/sites-available/beyondborders.conf
#   2. sudo ln -s /etc/nginx/sites-available/beyondborders.conf /etc/nginx/sites-enabled/beyondborders.conf
#   3. Remove Ghost CLI's main-domain configs from sites-enabled:
#        sudo rm /etc/nginx/sites-enabled/beyondborders.com.sa.conf
#        sudo rm /etc/nginx/sites-enabled/beyondborders.com.sa-ssl.conf
#   4. sudo nginx -t && sudo systemctl reload nginx

# ── HTTP ──────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name beyondborders.com.sa www.beyondborders.com.sa;

    # Required for acme.sh cert renewal
    root /var/www/beyondborders/system/nginx-root;

    location ~ ^/.well-known/acme-challenge {
        allow all;
    }

    location / {
        return 301 https://beyondborders.com.sa$request_uri;
    }
}

# ── HTTPS (Hugo static site) ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beyondborders.com.sa www.beyondborders.com.sa;

    # SSL — provisioned by Ghost CLI via acme.sh
    ssl_certificate     /etc/letsencrypt/beyondborders.com.sa/fullchain.cer;
    ssl_certificate_key /etc/letsencrypt/beyondborders.com.sa/beyondborders.com.sa.key;
    include             /etc/nginx/snippets/ssl-params.conf;

    # Redirect www → non-www
    if ($host = www.beyondborders.com.sa) {
        return 301 https://beyondborders.com.sa$request_uri;
    }

    root /var/www/beyondborders-static;
    index index.html;

    # HTML is gzipped by nginx.conf's default `gzip on`; CSS/JS/SVG/JSON need listing
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;

    client_max_body_size 50m;
}
